# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run independent tasks in parallel.
org.gradle.parallel=true

# The build cache is deliberately NOT enabled. Renaming a resource directory in this project
# produced a stale `mergeDebugResources` result from the local cache — a build that failed to
# compile against resources that were present on disk. Correctness of a clean build matters more
# here than incremental speed; enable it locally if you want it and are aware of that.
# org.gradle.caching=true

# AndroidX + non-transitive R classes (smaller R, faster incremental builds).
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
